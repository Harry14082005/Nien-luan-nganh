spring.application.name=nien-luan-nganh

# Server Port
server.port=8080

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
# createDatabaseIfNotExist=true giup tu dong tao database nien_luan_nganh neu chua ton tai
spring.datasource.url=jdbc:mysql://localhost:3306/nien_luan_nganh?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
# Điền mật khẩu tài khoản root MySQL của bạn vào đây:
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# Tu dong tao/cap nhat cau truc bang theo Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# JWT CONFIGURATION (Chuan bi cho Auth)
# ===============================
# Chuoi secret key toi thieu 256-bit (32 bytes) cho thuat toan HS256
jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Thoi gian song cua Access Token: 1 ngay (86400000 ms)
jwt.expiration=86400000
