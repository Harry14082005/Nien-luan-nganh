# ================================================
# SERVER
# ================================================
server.port=8080

# ================================================
# DATABASE - MySQL
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/aichat_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=kanekiken0
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ================================================
# JPA / HIBERNATE
# ================================================
spring.jpa.hibernate.ddl-auto=update

# Tắt show-sql trực tiếp để tránh in lặp với Logger
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Tắt OSIV để kiểm soát chặt chẽ Lazy Loading
spring.jpa.open-in-view=false

# ================================================
# LOGGING (Hiện câu lệnh SQL chuẩn định dạng)
# ================================================
logging.level.org.springframework=INFO
logging.level.com.nhom8.nien_luan_nganh=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# In cả giá trị tham số truyền vào dấu ?
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ================================================
# JWT (Dùng cho Security)
# ================================================
jwt.secret=your_jwt_secret_key_should_be_very_long_and_random_at_least_256_bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ================================================
# CORS (Đặt tiền tố riêng để Inject vào WebConfig)
# ================================================
app.cors.allowed-origins=http://localhost:5173

# ================================================
# REDIS (Lưu Cache & Session tạm)
# ================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000

# ================================================
# FILE UPLOAD (Ảnh chat / File đính kèm)
# ================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================================================
# AI INTEGRATION (Gemini API)
# ================================================
ai.gemini.api-key=your_gemini_api_key
ai.gemini.model=gemini-1.5-flash
ai.gemini.max-tokens=1000
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models