services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysqldb:
    image: mysql:8.0
    container_name: aichat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kanekiken0
      MYSQL_DATABASE: aichat_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aichat_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pkanekiken0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aichat_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/aichat_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: kanekiken0
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - aichat_network

networks:
  aichat_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
