<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swagger UI - Tài liệu API & DTOs (Nhóm 8 - Web Chat AI Assistant)</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-banner {
      background: #1e293b;
      color: #f8fafc;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 3px solid #3b82f6;
    }
    .top-banner h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .top-banner p {
      margin: 4px 0 0;
      font-size: 13px;
      color: #cbd5e1;
    }
    .banner-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background: #2563eb;
    }
    .btn-secondary {
      background: #475569;
    }
    .btn-secondary:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="top-banner">
    <div>
      <h1>📘 Tài liệu API &amp; DTO Specification — Nhóm 8 (Web Chat AI Assistant)</h1>
      <p>File độc lập bên ngoài đồ án: Mở trực tiếp trên trình duyệt hoặc bấm "Copy OpenAPI JSON" để dán lên <b>editor.swagger.io</b></p>
    </div>
    <div class="banner-actions">
      <button class="btn" onclick="copySpec()">📋 Copy OpenAPI JSON (Dán lên editor.swagger.io)</button>
      <a class="btn btn-secondary" href="https://editor.swagger.io/" target="_blank" rel="noopener">🌐 Mở editor.swagger.io</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    const openApiSpec = {
      openapi: "3.0.3",
      info: {
        title: "Web Chat AI Assistant API & DTO Contract - Nhóm 8",
        version: "1.0.0",
        description:
          "Bản hợp đồng dữ liệu (API & DTO Contract) giữa Backend (Spring Boot) và Frontend (Vue.js 3).\n\n" +
          "- **Base URL (REST):** `http://localhost:8080/api/v1`\n" +
          "- **WebSocket (SockJS):** `http://localhost:8080/ws` (STOMP Header `Authorization: Bearer <accessToken>`)\n" +
          "- **WebSocket (Native WS):** `ws://localhost:8080/ws-raw` (STOMP Header `Authorization: Bearer <accessToken>`)\n" +
          "- **Mẹo cho Frontend:** Kéo xuống cuối trang mục **Schemas** để xem toàn bộ cấu trúc các `Request DTO`, `Response DTO`, `WebSocket Payload` và `Enum`."
      },
      servers: [
        {
          url: "http://localhost:8080",
          description: "Local Backend Server (Spring Boot)"
        }
      ],
      tags: [
        { name: "1. Auth", description: "Đăng ký, Đăng nhập, Làm mới Token, Đăng xuất (/api/v1/auth)" },
        { name: "2. Users", description: "Hồ sơ cá nhân, Đổi mật khẩu/Email/SĐT, Tìm kiếm người dùng (/api/v1/users)" },
        { name: "3. Friendships", description: "Kết bạn, Chấp nhận/Từ chối, Hủy kết bạn, Chặn/Bỏ chặn (/api/v1/friendships)" },
        { name: "4. Rooms", description: "Phòng chat 1-1 (DIRECT), Phòng nhóm (GROUP), Danh sách phòng Sidebar (/api/v1/rooms)" },
        { name: "5. Room Members", description: "Quản lý thành viên nhóm, Phân quyền, Duyệt thành viên, Rời phòng (/api/v1/rooms/{roomId}/members)" },
        { name: "6. Messages & Reactions", description: "Gửi/Sửa/Thu hồi tin nhắn, Ghim tin nhắn, Thả/Gỡ cảm xúc, Phân trang Cursor (/api/v1/rooms/{roomId}/messages)" },
        { name: "7. WebSocket STOMP (Reference)", description: "Tài liệu tham khảo các kênh WebSocket STOMP gửi lên (/app/*) và nhận về (/topic/*)" }
      ],
      security: [{ bearerAuth: [] }],
      paths: {
        "/api/v1/auth/register": {
          post: {
            tags: ["1. Auth"],
            summary: "Đăng ký tài khoản mới (Email hoặc SĐT)",
            security: [],
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/RegisterRequest" } } }
            },
            responses: {
              "201": { description: "Đăng ký thành công, trả về bộ JWT Token và thông tin User", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_AuthResponse" } } } }
            }
          }
        },
        "/api/v1/auth/login": {
          post: {
            tags: ["1. Auth"],
            summary: "Đăng nhập bằng Email hoặc SĐT",
            security: [],
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/LoginRequest" } } }
            },
            responses: {
              "200": { description: "Đăng nhập thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_AuthResponse" } } } }
            }
          }
        },
        "/api/v1/auth/refresh": {
          post: {
            tags: ["1. Auth"],
            summary: "Làm mới Access Token từ Refresh Token",
            security: [],
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/RefreshTokenRequest" } } }
            },
            responses: {
              "200": { description: "Cấp mới token thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_AuthResponse" } } } }
            }
          }
        },
        "/api/v1/auth/logout": {
          post: {
            tags: ["1. Auth"],
            summary: "Đăng xuất khỏi hệ thống",
            responses: {
              "200": { description: "Đăng xuất thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_Void" } } } }
            }
          }
        },
        "/api/v1/users/me": {
          get: {
            tags: ["2. Users"],
            summary: "Lấy thông tin cá nhân hiện tại",
            responses: {
              "200": { description: "Thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_UserResponse" } } } }
            }
          },
          put: {
            tags: ["2. Users"],
            summary: "Cập nhật hồ sơ cá nhân (username, avatarUrl, gender, description, preferredLanguage)",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/UpdateProfileRequest" } } }
            },
            responses: {
              "200": { description: "Cập nhật thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_UserResponse" } } } }
            }
          }
        },
        "/api/v1/users/me/password": {
          put: {
            tags: ["2. Users"],
            summary: "Đổi mật khẩu (hỗ trợ cả /api/v1/user/me/password)",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } }
            },
            responses: {
              "200": { description: "Đổi mật khẩu thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_Void" } } } }
            }
          }
        },
        "/api/v1/users/me/email": {
          put: {
            tags: ["2. Users"],
            summary: "Đổi địa chỉ Email (hỗ trợ cả /api/v1/user/me/email)",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/UpdateEmailRequest" } } }
            },
            responses: {
              "200": { description: "Đổi email thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_UserResponse" } } } }
            }
          }
        },
        "/api/v1/users/me/phone": {
          put: {
            tags: ["2. Users"],
            summary: "Đổi Số điện thoại (hỗ trợ cả /api/v1/user/me/phone)",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/UpdatePhoneRequest" } } }
            },
            responses: {
              "200": { description: "Đổi số điện thoại thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_UserResponse" } } } }
            }
          }
        },
        "/api/v1/users/search": {
          get: {
            tags: ["2. Users"],
            summary: "Tìm kiếm người dùng theo từ khóa (email, SĐT, username)",
            parameters: [
              { name: "q", in: "query", required: true, schema: { type: "string" }, description: "Từ khóa tìm kiếm" },
              { name: "page", in: "query", schema: { type: "integer", default: 0 } },
              { name: "size", in: "query", schema: { type: "integer", default: 10 } }
            ],
            responses: {
              "200": { description: "Danh sách người dùng phân trang", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_PageUserResponse" } } } }
            }
          }
        },
        "/api/v1/users/{userId}": {
          get: {
            tags: ["2. Users"],
            summary: "Xem thông tin trang cá nhân của người dùng khác",
            parameters: [
              { name: "userId", in: "path", required: true, schema: { type: "string", format: "uuid" } }
            ],
            responses: {
              "200": { description: "Thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_UserResponse" } } } }
            }
          }
        },
        "/api/v1/users/{userId}/presence": {
          get: {
            tags: ["2. Users"],
            summary: "Lấy trạng thái hiện diện (User Presence) của người dùng",
            parameters: [
              { name: "userId", in: "path", required: true, schema: { type: "string", format: "uuid" } }
            ],
            responses: {
              "200": { description: "Thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_UserPresenceResponse" } } } }
            }
          }
        },
        "/api/v1/users/presence/batch": {
          post: {
            tags: ["2. Users"],
            summary: "Lấy trạng thái hiện diện hàng loạt cho nhiều người dùng (Batch Presence - Tối đa 100 users, tự khử trùng lặp)",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/BatchPresenceRequest" } } }
            },
            responses: {
              "200": { description: "Thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_ListUserPresenceResponse" } } } }
            }
          }
        },
        "/api/v1/friendships": {
          get: {
            tags: ["3. Friendships"],
            summary: "Lấy danh sách bạn bè / lời mời / chặn theo trạng thái",
            parameters: [
              { name: "status", in: "query", required: false, schema: { $ref: "#/components/schemas/FriendshipStatus" }, description: "Mặc định ACCEPTED" },
              { name: "page", in: "query", schema: { type: "integer", default: 0 } },
              { name: "size", in: "query", schema: { type: "integer", default: 10 } }
            ],
            responses: {
              "200": { description: "Danh sách quan hệ bạn bè", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_PageFriendshipResponse" } } } }
            }
          }
        },
        "/api/v1/friendships/request": {
          post: {
            tags: ["3. Friendships"],
            summary: "Gửi lời mời kết bạn",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/FriendshipRequest" } } }
            },
            responses: {
              "201": { description: "Đã gửi lời mời kết bạn", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_FriendshipResponse" } } } }
            }
          }
        },
        "/api/v1/friendships/{friendshipId}/accept": {
          put: {
            tags: ["3. Friendships"],
            summary: "Chấp nhận lời mời kết bạn",
            parameters: [{ name: "friendshipId", in: "path", required: true, schema: { type: "string", format: "uuid" } }],
            responses: {
              "200": { description: "Đã chấp nhận kết bạn", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_FriendshipResponse" } } } }
            }
          }
        },
        "/api/v1/friendships/{friendshipId}/decline": {
          put: {
            tags: ["3. Friendships"],
            summary: "Từ chối lời mời kết bạn",
            parameters: [{ name: "friendshipId", in: "path", required: true, schema: { type: "string", format: "uuid" } }],
            responses: {
              "200": { description: "Đã từ chối lời mời", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_Void" } } } }
            }
          }
        },
        "/api/v1/friendships/{friendshipId}": {
          delete: {
            tags: ["3. Friendships"],
            summary: "Hủy kết bạn hoặc thu hồi lời mời đã gửi",
            parameters: [{ name: "friendshipId", in: "path", required: true, schema: { type: "string", format: "uuid" } }],
            responses: {
              "200": { description: "Đã hủy kết bạn", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_Void" } } } }
            }
          }
        },
        "/api/v1/friendships/block": {
          post: {
            tags: ["3. Friendships"],
            summary: "Chặn một người dùng",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/BlockUserRequest" } } }
            },
            responses: {
              "200": { description: "Đã chặn người dùng", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_FriendshipResponse" } } } }
            }
          }
        },
        "/api/v1/friendships/block/{userId}": {
          delete: {
            tags: ["3. Friendships"],
            summary: "Bỏ chặn người dùng",
            parameters: [{ name: "userId", in: "path", required: true, schema: { type: "string", format: "uuid" } }],
            responses: {
              "200": { description: "Đã bỏ chặn", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_Void" } } } }
            }
          }
        },
        "/api/v1/rooms": {
          get: {
            tags: ["4. Rooms"],
            summary: "Lấy danh sách phòng chat (Sidebar) kèm tin cuối, hasUnread và unreadCount",
            parameters: [
              { name: "type", in: "query", required: false, schema: { $ref: "#/components/schemas/RoomType" }, description: "Lọc theo DIRECT hoặc GROUP (bỏ trống để lấy tất cả)" },
              { name: "pageNo", in: "query", schema: { type: "integer", default: 0 } },
              { name: "pageSize", in: "query", schema: { type: "integer", default: 20 } }
            ],
            responses: {
              "200": { description: "Danh sách phòng chat phân trang", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_PageRoomListResponse" } } } }
            }
          }
        },
        "/api/v1/rooms/group": {
          post: {
            tags: ["4. Rooms"],
            summary: "Tạo phòng chat nhóm (GROUP)",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/CreateGroupRequest" } } }
            },
            responses: {
              "201": { description: "Tạo nhóm thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_RoomDetailResponse" } } } }
            }
          }
        },
        "/api/v1/rooms/direct": {
          post: {
            tags: ["4. Rooms"],
            summary: "Tạo hoặc lấy phòng chat trực tiếp 1-1 (DIRECT)",
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/CreateDirectRoomRequest" } } }
            },
            responses: {
              "201": { description: "Trả về thông tin phòng 1-1", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_RoomDetailResponse" } } } }
            }
          }
        },
        "/api/v1/rooms/{roomId}": {
          get: {
            tags: ["4. Rooms"],
            summary: "Lấy thông tin chi tiết một phòng chat",
            parameters: [{ name: "roomId", in: "path", required: true, schema: { type: "string", format: "uuid" } }],
            responses: {
              "200": { description: "Chi tiết phòng", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_RoomDetailResponse" } } } }
            }
          }
        },
        "/api/v1/rooms/{roomId}/members": {
          get: {
            tags: ["5. Room Members"],
            summary: "Lấy danh sách thành viên trong phòng (lọc theo ACTIVE hoặc PENDING)",
            parameters: [
              { name: "roomId", in: "path", required: true, schema: { type: "string", format: "uuid" } },
              { name: "status", in: "query", required: false, schema: { $ref: "#/components/schemas/RoomMemberStatus" } }
            ],
            responses: {
              "200": { description: "Danh sách thành viên", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_ListRoomMemberResponse" } } } }
            }
          },
          post: {
            tags: ["5. Room Members"],
            summary: "Thêm thành viên mới vào nhóm",
            parameters: [{ name: "roomId", in: "path", required: true, schema: { type: "string", format: "uuid" } }],
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/AddMemberRequest" } } }
            },
            responses: {
              "200": { description: "Thêm thành viên thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_ListRoomMemberResponse" } } } }
            }
          }
        },
        "/api/v1/rooms/{roomId}/members/{userId}": {
          delete: {
            tags: ["5. Room Members"],
            summary: "Xóa thành viên khỏi nhóm",
            parameters: [
              { name: "roomId", in: "path", required: true, schema: { type: "string", format: "uuid" } },
              { name: "userId", in: "path", required: true, schema: { type: "string", format: "uuid" } }
            ],
            requestBody: {
              required: false,
              content: { "application/json": { schema: { $ref: "#/components/schemas/RemoveMemberRequest" } } }
            },
            responses: {
              "200": { description: "Xóa thành viên thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_Void" } } } }
            }
          }
        },
        "/api/v1/rooms/{roomId}/members/leave": {
          delete: {
            tags: ["5. Room Members"],
            summary: "Rời phòng chat (kèm newAdminId nếu Admin duy nhất rời nhóm)",
            parameters: [{ name: "roomId", in: "path", required: true, schema: { type: "string", format: "uuid" } }],
            requestBody: {
              required: false,
              content: { "application/json": { schema: { $ref: "#/components/schemas/LeaveRoomRequest" } } }
            },
            responses: {
              "200": { description: "Rời phòng thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_Void" } } } }
            }
          }
        },
        "/api/v1/rooms/{roomId}/members/{userId}/role": {
          put: {
            tags: ["5. Room Members"],
            summary: "Thay đổi vai trò thành viên (ADMIN / MEMBER)",
            parameters: [
              { name: "roomId", in: "path", required: true, schema: { type: "string", format: "uuid" } },
              { name: "userId", in: "path", required: true, schema: { type: "string", format: "uuid" } }
            ],
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" } } }
            },
            responses: {
              "200": { description: "Đổi quyền thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_RoomMemberResponse" } } } }
            }
          }
        },
        "/api/v1/rooms/{roomId}/members/{userId}/approve": {
          put: {
            tags: ["5. Room Members"],
            summary: "Phê duyệt thành viên đang chờ vào nhóm",
            parameters: [
              { name: "roomId", in: "path", required: true, schema: { type: "string", format: "uuid" } },
              { name: "userId", in: "path", required: true, schema: { type: "string", format: "uuid" } }
            ],
            requestBody: {
              required: true,
              content: { "application/json": { schema: { $ref: "#/components/schemas/ApproveMemberRequest" } } }
            },
            responses: {
              "200": { description: "Phê duyệt thành công", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_RoomMemberResponse" } } } }
            }
          }
        },
        "/api/v1/rooms/{roomId}/messages": {
          get: {
            tags: ["6. Messages & Reactions"],
            summary: "Lấy lịch sử tin nhắn theo phân trang con trỏ (Cursor-based Pagination)",
            parameters: [
              { name: "roomId", in: "path", required: true, schema: { type: "string", format: "uuid" } },
              { name: "cursor", in: "query", required: false, schema: { type: "string", format: "uuid" }, description: "ID tin nhắn mốc để tải các tin cũ hơn" },
              { name: "before", in: "query", required: false, schema: { type: "string", format: "uuid" }, description: "Alias cho cursor" },
              { name: "limit", in: "query", required: false, schema: { type: "integer", default: 20 } }
            ],
            responses: {
              "200": { description: "Danh sách tin nhắn kèm nextCursor và hasMore", content: { "application/json": { schema: { $ref: "#/components/schemas/ApiResponse_CursorMessageResponse" } } } }
            }
          },
          post: {
            tags: ["6. Messages & Reactions"],
